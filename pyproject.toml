[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "best-foot-forward"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "markdown-graph-kit @ git+https://github.com/Burney-Web-Services/Markdown-Graph-Kit.git",
    "python-docx==1.2.0",
    "pypdf2==3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
http = [
    "aiohttp>=3.9",
]
audio = [
    "faster-whisper>=1.0.0",
    "pyannote.audio>=4.0.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "torch",
    "torchaudio",
]

[project.scripts]
bff-mcp = "best_foot_forward.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." is required, not cosmetic: tests/uat/test_uat_history.py imports `tests.uat`,
# which only resolves when the repo root is on sys.path. `python -m pytest` adds cwd
# implicitly, but a bare `pytest` / `uv run pytest` does not — without this, the
# obvious invocation fails at collection.
pythonpath = ["src", "."]
testpaths = ["tests"]
