name: Feature request
description: Something the tool should do and doesn't.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        Start with what you were trying to do, not with the feature. The best requests here have
        come from someone mid-search hitting a wall.
      placeholder: |
        I interviewed with the same company for two different roles and had no way to see both
        threads together — each application's prep doc was written as if the other didn't exist.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd want it to do
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you're doing instead today
      description: Even "nothing, I gave up on that part" is useful — it tells us how much the gap costs.

  - type: markdown
    attributes:
      value: |
        Worth a look before you file: [`docs/roadmap.md`](../blob/main/docs/roadmap.md) lists what's
        already under consideration, and [`docs/adr/`](../blob/main/docs/adr) records decisions that
        were made deliberately — if something seems oddly designed, the reasoning may be in there.
